<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Townlight Parks 0.2.0 architecture — source integration candidate</title>
  <desc id="diagram-desc">
    Source integration candidate architecture for Townlight Parks 0.2.0, not an installed build. The existing Windows TypeScript staff app sends authenticated staff commands into the shared Suite host, which provides roles, CSRF and session ownership, an encrypted command inbox with durable command IDs, a host pump with fixed native command dispatch, and a separate Records archive permission. The resident portal sends CSRF-protected session-owned commands into the same encrypted inbox. Host-applied commands drive the Python townlight_parks runtime, which uses PostgreSQL schema townlight_parks through SQLAlchemy with explicit migrations and production bootstrap disabled, and managed file bytes. Side integrations and external edges include real 311 maintenance requests, approved Communications source snapshots, a private Records archive controlled by separate permission and content hashes, explicit scoped aggregate Data export, optional hosted Stripe Checkout with no live charge verified, and an email notifications outbox where queued is not delivered.
  </desc>

  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
